[package]
name = "notifi-printer"
version = "0.1.0"
edition = "2021"
default-run = "notifi-printer"

[profile.release]
# panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = 3     # Optimize for binary size - P.S, default release is 3 anyway
strip = true      # Remove debug symbols

[[bin]]
name = "notifi-printer"
path = "src/main.rs"

[[bin]]
name = "charcode"
path = "src/bin/charcode.rs"

[[bin]]
name = "custom"
path = "src/bin/custom.rs"

[[bin]]
name = "gmail-test"
path = "src/bin/gmail-test.rs"

[dependencies]
async-imap = {version = "0.10.4", default-features = false, features = ["runtime-tokio", "async-compression"]}
axum = "0.8.1"
chrono = "0.4.38"
console-subscriber = "0.4.1"
dotenvy = "0.15.7"
emojis = "0.6.4"
futures-util = "0.3.31"
imap-proto = "0.16.5"
native-tls = "0.2.12"
regex = "1.11.1"
reqwest = { version = "0.12.8", features = ["gzip", "brotli", "zstd", "json"] }
serde = { version = "1.0.213", features = ["derive"] }
serde_json = "1.0.132"
textwrap = { version = "0.16.1", features = ["smawk"] }
tokio = { version = "1.41.0", features = ["full", "tracing"] }
tokio-native-tls = "0.3.1"
tokio-tungstenite = { version = "0.24.0", features = ["native-tls"] }
tokio-util = { version = "0.7.12", features = ["rt"] }
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "print_data_merging"
harness = false
